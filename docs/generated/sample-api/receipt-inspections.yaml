openapi: 3.1.0
info:
  title: 入荷検品
  description: 検品票ごとに検品場所、ロット番号、検出した不良数を照会します。
  version: 1.0.0
paths:
  /health:
    get:
      summary: データベースの稼働状態を確認
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /inspections:
    get:
      summary: 入荷検品を一覧で取得
      operationId: list_inspections_inspections_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Inspection'
                type: array
                title: Response List Inspections Inspections Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /inspections/{inspection_id}:
    get:
      summary: 入荷検品の明細を照会
      operationId: detail_inspections__inspection_id__get
      parameters:
      - name: inspection_id
        in: path
        required: true
        schema:
          type: string
          title: Inspection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inspection'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '404':
          description: 該当なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingRecord'
  /inspection-docks:
    get:
      summary: 入荷検品を荷受口別に集計
      operationId: by_dock_inspection_docks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InspectionCount'
                type: array
                title: Response By Dock Inspection Docks Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /low-defect-lots:
    get:
      summary: 不良数が指定値以下の入荷検品を取得
      operationId: below_limit_low_defect_lots_get
      parameters:
      - name: maximum
        in: query
        required: false
        schema:
          type: integer
          description: 不良数の上限
          default: 0
          title: Maximum
        description: 不良数の上限
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inspection'
                title: Response Below Limit Low Defect Lots Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /inspection-defects:
    get:
      summary: 不良数の最小値と最大値を取得
      operationId: defect_count_summary_inspection_defects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionRange'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: Health
    Inspection:
      properties:
        inspection_id:
          type: string
          title: Inspection Id
        dock:
          type: string
          title: Dock
        lot_code:
          type: string
          title: Lot Code
        defect_count:
          type: integer
          title: Defect Count
      type: object
      required:
      - inspection_id
      - dock
      - lot_code
      - defect_count
      title: Inspection
    InspectionCount:
      properties:
        dock:
          type: string
          title: Dock
        count:
          type: integer
          title: Count
      type: object
      required:
      - dock
      - count
      title: InspectionCount
    InspectionRange:
      properties:
        minimum_defect_count:
          type: integer
          title: Minimum Defect Count
        maximum_defect_count:
          type: integer
          title: Maximum Defect Count
      type: object
      required:
      - minimum_defect_count
      - maximum_defect_count
      title: InspectionRange
    InternalServerError:
      properties:
        error_code:
          type: string
          const: INTERNAL_ERROR
          title: Error Code
        detail:
          type: string
          title: Detail
      type: object
      required:
      - error_code
      - detail
      title: InternalServerError
    MissingRecord:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: MissingRecord
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
