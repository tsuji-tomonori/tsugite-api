openapi: 3.1.0
info:
  title: 発注受付
  description: 購買依頼を送信し、受け付けた注文の番号を取得します。
  version: 1.0.0
paths:
  /health:
    get:
      summary: データベースの稼働状態を確認
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /orders:
    get:
      summary: 発注を一覧で取得
      operationId: list_orders_orders_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
                type: array
                title: Response List Orders Orders Get
    post:
      summary: 見本の仕入先で発注結果を試算
      operationId: preview_order_orders_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_id}:
    get:
      summary: 発注の詳細を取得
      operationId: detail_orders__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '404':
          description: 該当なし
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /suppliers:
    get:
      summary: 仕入先ごとの発注件数を集計
      operationId: by_supplier_suppliers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PurchaseOrderCount'
                type: array
                title: Response By Supplier Suppliers Get
  /ordered-units:
    get:
      summary: 数量の合計を取得
      operationId: units_summary_ordered_units_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderTotal'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: Health
    OrderRequest:
      properties:
        units:
          type: integer
          maximum: 1000.0
          exclusiveMinimum: 0.0
          title: Units
      type: object
      required:
      - units
      title: OrderRequest
    PurchaseOrder:
      properties:
        order_id:
          type: string
          title: Order Id
        supplier:
          type: string
          title: Supplier
        units:
          type: integer
          title: Units
      type: object
      required:
      - order_id
      - supplier
      - units
      title: PurchaseOrder
    PurchaseOrderCount:
      properties:
        supplier:
          type: string
          title: Supplier
        count:
          type: integer
          title: Count
      type: object
      required:
      - supplier
      - count
      title: PurchaseOrderCount
    PurchaseOrderTotal:
      properties:
        total:
          type: integer
          title: Total
      type: object
      required:
      - total
      title: PurchaseOrderTotal
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
