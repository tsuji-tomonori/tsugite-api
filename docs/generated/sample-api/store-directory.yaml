openapi: 3.1.0
info:
  title: 店舗ディレクトリ
  description: 店舗コード、所在地、営業エリアを一覧で取得します。
  version: 1.0.0
paths:
  /health:
    get:
      summary: データベースの稼働状態を確認
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /stores:
    get:
      summary: 店舗を一覧で取得
      operationId: list_stores_stores_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Store'
                type: array
                title: Response List Stores Stores Get
  /stores/{store_code}:
    get:
      summary: 店舗の詳細を取得
      operationId: detail_stores__store_code__get
      parameters:
      - name: store_code
        in: path
        required: true
        schema:
          type: string
          title: Store Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '404':
          description: 該当なし
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /service-areas:
    get:
      summary: 市区町村ごとの店舗件数を集計
      operationId: by_city_service_areas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StoreCount'
                type: array
                title: Response By City Service Areas Get
  /small-stores:
    get:
      summary: 座席数が上限以下の店舗を取得
      operationId: below_limit_small_stores_get
      parameters:
      - name: maximum
        in: query
        required: false
        schema:
          type: integer
          description: 座席数の上限
          default: 32
          title: Maximum
        description: 座席数の上限
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
                title: Response Below Limit Small Stores Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /seat-capacity:
    get:
      summary: 座席数の合計を取得
      operationId: seats_summary_seat_capacity_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreTotal'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: Health
    Store:
      properties:
        store_code:
          type: string
          title: Store Code
        city:
          type: string
          title: City
        seats:
          type: integer
          title: Seats
      type: object
      required:
      - store_code
      - city
      - seats
      title: Store
    StoreCount:
      properties:
        city:
          type: string
          title: City
        count:
          type: integer
          title: Count
      type: object
      required:
      - city
      - count
      title: StoreCount
    StoreTotal:
      properties:
        total:
          type: integer
          title: Total
      type: object
      required:
      - total
      title: StoreTotal
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
