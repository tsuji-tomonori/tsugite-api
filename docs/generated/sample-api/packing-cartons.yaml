openapi: 3.1.0
info:
  title: 梱包箱規格
  description: 梱包箱の材質と寸法区分ごとの最大積載重量を照会します。
  version: 1.0.0
paths:
  /health:
    get:
      summary: データベースの稼働状態を確認
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /cartons:
    get:
      summary: 梱包箱規格を一覧で取得
      operationId: list_cartons_cartons_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Carton'
                type: array
                title: Response List Cartons Cartons Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /cartons/{carton_code}:
    get:
      summary: 梱包箱規格の明細を照会
      operationId: detail_cartons__carton_code__get
      parameters:
      - name: carton_code
        in: path
        required: true
        schema:
          type: string
          title: Carton Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carton'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '404':
          description: 該当なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingRecord'
  /carton-materials:
    get:
      summary: 梱包箱規格を材質別に集計
      operationId: by_material_carton_materials_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CartonCount'
                type: array
                title: Response By Material Carton Materials Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /light-duty-cartons:
    get:
      summary: 耐荷重キログラムが指定値以下の梱包箱規格を取得
      operationId: below_limit_light_duty_cartons_get
      parameters:
      - name: maximum
        in: query
        required: false
        schema:
          type: integer
          description: 耐荷重キログラムの上限
          default: 3
          title: Maximum
        description: 耐荷重キログラムの上限
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Carton'
                title: Response Below Limit Light Duty Cartons Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /carton-loads:
    get:
      summary: 耐荷重キログラムの最小値と最大値を取得
      operationId: load_kg_summary_carton_loads_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartonRange'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
components:
  schemas:
    Carton:
      properties:
        carton_code:
          type: string
          title: Carton Code
        material:
          type: string
          title: Material
        size_grade:
          type: string
          title: Size Grade
        load_kg:
          type: integer
          title: Load Kg
      type: object
      required:
      - carton_code
      - material
      - size_grade
      - load_kg
      title: Carton
    CartonCount:
      properties:
        material:
          type: string
          title: Material
        count:
          type: integer
          title: Count
      type: object
      required:
      - material
      - count
      title: CartonCount
    CartonRange:
      properties:
        minimum_load_kg:
          type: integer
          title: Minimum Load Kg
        maximum_load_kg:
          type: integer
          title: Maximum Load Kg
      type: object
      required:
      - minimum_load_kg
      - maximum_load_kg
      title: CartonRange
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: Health
    InternalServerError:
      properties:
        error_code:
          type: string
          const: INTERNAL_ERROR
          title: Error Code
        detail:
          type: string
          title: Detail
      type: object
      required:
      - error_code
      - detail
      title: InternalServerError
    MissingRecord:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: MissingRecord
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
