openapi: 3.1.0
info:
  title: 配送追跡
  description: 送り状番号に対応する荷物の配送状況を照会します。
  version: 1.0.0
paths:
  /health:
    get:
      summary: データベースの稼働状態を確認
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /parcels:
    get:
      summary: 荷物を一覧で取得
      operationId: list_parcels_parcels_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Parcel'
                type: array
                title: Response List Parcels Parcels Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /parcels/{parcel}:
    get:
      summary: 荷物の詳細を取得
      operationId: detail_parcels__parcel__get
      parameters:
      - name: parcel
        in: path
        required: true
        schema:
          type: string
          title: Parcel
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '404':
          description: 該当なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingRecord'
  /delivery-statuses:
    get:
      summary: 配送状況ごとの荷物件数を集計
      operationId: by_status_delivery_statuses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ParcelCount'
                type: array
                title: Response By Status Delivery Statuses Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /light-parcels:
    get:
      summary: 重量（g）が上限以下の荷物を取得
      operationId: below_limit_light_parcels_get
      parameters:
      - name: maximum
        in: query
        required: false
        schema:
          type: integer
          description: 重量（g）の上限
          default: 750
          title: Maximum
        description: 重量（g）の上限
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
                title: Response Below Limit Light Parcels Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /shipment-weight:
    get:
      summary: 重量（g）の合計を取得
      operationId: weight_grams_summary_shipment_weight_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelTotal'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: Health
    InternalServerError:
      properties:
        error_code:
          type: string
          const: INTERNAL_ERROR
          title: Error Code
        detail:
          type: string
          title: Detail
      type: object
      required:
      - error_code
      - detail
      title: InternalServerError
    MissingRecord:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: MissingRecord
    Parcel:
      properties:
        parcel:
          type: string
          title: Parcel
        status:
          type: string
          title: Status
        weight_grams:
          type: integer
          title: Weight Grams
      type: object
      required:
      - parcel
      - status
      - weight_grams
      title: Parcel
    ParcelCount:
      properties:
        status:
          type: string
          title: Status
        count:
          type: integer
          title: Count
      type: object
      required:
      - status
      - count
      title: ParcelCount
    ParcelTotal:
      properties:
        total:
          type: integer
          title: Total
      type: object
      required:
      - total
      title: ParcelTotal
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
