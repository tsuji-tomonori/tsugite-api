openapi: 3.1.0
info:
  title: 会議室台帳
  description: 会議室を建物や定員で検索します。
  version: 1.0.0
paths:
  /health:
    get:
      summary: データベースの稼働状態を確認
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /rooms:
    get:
      summary: 会議室を一覧で取得
      operationId: list_rooms_rooms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MeetingRoom'
                type: array
                title: Response List Rooms Rooms Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /rooms/{room_id}:
    get:
      summary: 会議室の詳細を取得
      operationId: detail_rooms__room_id__get
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingRoom'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '404':
          description: 該当なし
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingRecord'
  /buildings:
    get:
      summary: 建物ごとの会議室件数を集計
      operationId: by_building_buildings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MeetingRoomCount'
                type: array
                title: Response By Building Buildings Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /small-rooms:
    get:
      summary: 定員が上限以下の会議室を取得
      operationId: below_limit_small_rooms_get
      parameters:
      - name: maximum
        in: query
        required: false
        schema:
          type: integer
          description: 定員の上限
          default: 8
          title: Maximum
        description: 定員の上限
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingRoom'
                title: Response Below Limit Small Rooms Get
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /room-capacity:
    get:
      summary: 定員の合計を取得
      operationId: capacity_summary_room_capacity_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingRoomTotal'
        '500':
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: Health
    InternalServerError:
      properties:
        error_code:
          type: string
          const: INTERNAL_ERROR
          title: Error Code
        detail:
          type: string
          title: Detail
      type: object
      required:
      - error_code
      - detail
      title: InternalServerError
    MeetingRoom:
      properties:
        room_id:
          type: string
          title: Room Id
        building:
          type: string
          title: Building
        capacity:
          type: integer
          title: Capacity
      type: object
      required:
      - room_id
      - building
      - capacity
      title: MeetingRoom
    MeetingRoomCount:
      properties:
        building:
          type: string
          title: Building
        count:
          type: integer
          title: Count
      type: object
      required:
      - building
      - count
      title: MeetingRoomCount
    MeetingRoomTotal:
      properties:
        total:
          type: integer
          title: Total
      type: object
      required:
      - total
      title: MeetingRoomTotal
    MissingRecord:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: MissingRecord
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
