[project]
name = "tsugite-api"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "tests/e2e"]

[tool.uv.sources]
tsugite-model = { workspace = true }
tsugite-agent = { workspace = true }
tsugite-backend = { workspace = true }
tsugite-database = { workspace = true }
tsugite-frontend = { workspace = true }
tsugite-infra = { workspace = true }

[tool.uv]
constraint-dependencies = ["pydantic>=2,<3", "sqlalchemy>=2,<3", "aws-cdk-lib>=2.278,<3"]

[dependency-groups]
quality-docs = ["pyyaml"]
dev = ["pytest>=9", "pytest-given", "ruff", "pytest-cov", "pyright", "mypy", "pytestarch", "pip-audit"]

[tool.pytest.ini_options]
addopts = ["-p", "tests.support.pytest_cases"]
junit_family = "xunit1"
markers = ["case_detail(text): パラメーターごとの条件や期待結果を日本語で示す"]
pythonpath = ["packages/sample_api/src", "packages/agent/src", "packages/backend/src", "packages/database/src", "."]
testpaths = ["packages/sample_api/tests", "packages/agent/tests", "packages/model/tests", "tests/architecture", "packages/backend/tests", "packages/frontend/tests", "packages/infra/tests", "packages/database/tests", "tests/e2e/browser", "packages/tools/tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "packages/backend/src/app",
    "packages/database",
    "packages/frontend/src/web_app",
    "packages/infra",
    "packages/sample_api/src/sample_api",
    "packages/agent/src",
    "packages/model/src",
    "packages/tools",
]
omit = ["*/tests/*", "*/cdk.out/*", "*/__pycache__/*"]

[tool.coverage.report]
include_namespace_packages = true

[tool.ruff]
target-version = "py315"
line-length = 105
extend-exclude = ["build", "cdk.out", "dist", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "F631", "PT011", "PT012"]

[tool.pyright]
include = ["packages/agent","packages/model","packages/backend/src/app","packages/database/src/tsugite_db"]
extraPaths = ["packages/agent/src","packages/model/src","packages/backend/src","packages/backend/src/app/core","packages/database/src"]
pythonVersion = "3.15"
exclude = ["packages/model/src/decision.py", "**/.venv", "**/__pycache__"]
strict = ["packages/database/src/tsugite_db/models", "packages/backend/src/app/schemas/catalog.py", "packages/backend/src/app/schemas/base.py"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/database/src/tsugite_db/models", "packages/backend/src/app/schemas/catalog.py", "packages/backend/src/app/schemas/base.py"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.tsugite.unit-coverage]
line = 90
branch = 85
