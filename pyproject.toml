[project]
name = "tsugite-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["tsugite-backend", "tsugite-frontend", "tsugite-infra"]

[tool.uv.workspace]
members = ["backend","frontend","infra"]

[tool.uv.sources]
tsugite-backend = { workspace = true }
tsugite-frontend = { workspace = true }
tsugite-infra = { workspace = true }

[dependency-groups]
dev = ["pytest>=9","pytest-given","ruff","playwright","pytest-cov","pyright","mypy","pytestarch","pip-audit"]

[tool.pytest.ini_options]
pythonpath = ["backend/src","infra","."]
testpaths = ["tests","backend/tests","infra/tests"]

[tool.ruff]
target-version = "py314"
line-length = 105

extend-exclude = ["build", "cdk.out", "dist", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "F631", "PT011", "PT012"]

[tool.pyright]
include = ["backend/src/app"]
extraPaths = ["backend/src"]
pythonVersion = "3.14"
strict = ["backend/src/app/db/models.py", "backend/src/app/apis/schemas.py"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["backend/src/app/db/models.py", "backend/src/app/apis/schemas.py"]
