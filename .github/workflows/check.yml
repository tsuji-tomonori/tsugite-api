name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv tool install go-task-bin==3.54.0
      - run: task setup
      - run: task browser:install
      - run: task emulator:install
      - run: task ci
      - name: Build screenshot report
        if: always() && !cancelled()
        run: task report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-and-test-results
          path: |
            artifacts/
            packages/infra/cdk.out/*.template.json
            docs/generated/
  publish-design:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-generated-design
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install go-task-bin==3.54.0
      - run: task setup
      - run: task docs:commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
