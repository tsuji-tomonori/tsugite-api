name: Verify portal chat
on:
  push:
    branches: [verify/portal-chat-lambda]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [agent, model, api, browser, cdk, synth]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-packages --python 3.14
      - if: matrix.suite == 'browser'
        run: |
          uv run --locked playwright install --with-deps chromium --only-shell
          uv run --locked python packages/tools/packaging/build_frontend.py
      - if: matrix.suite == 'agent' || matrix.suite == 'model'
        env:
          PACKAGE: ${{ matrix.suite }}
        run: uv run --locked pytest -q "packages/$PACKAGE/tests" --junitxml="artifacts/$PACKAGE.xml"
      - if: matrix.suite == 'api'
        run: |
          uv run --locked python -m packages.tools.operations.manage contracts
          uv run --locked python -m packages.tools.design.generate
          uv run --locked pytest -q packages/backend/tests packages/database/tests packages/tools/tests --junitxml=artifacts/api.xml
      - if: matrix.suite == 'browser'
        run: uv run --locked pytest -q tests/e2e/browser --junitxml=artifacts/browser.xml
      - if: matrix.suite == 'cdk'
        run: uv run --locked pytest -q packages/infra/tests --junitxml=artifacts/cdk.xml
      - if: matrix.suite == 'synth'
        run: uv run --locked python -m packages.tools.operations.manage synth --help && uv run --locked python -m packages.tools.operations.manage synth
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-chat-${{ matrix.suite }}
          path: |
            artifacts/
            packages/infra/cdk.out/*.template.json
          if-no-files-found: ignore
