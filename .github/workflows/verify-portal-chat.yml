name: Verify portal chat
on:
  push:
    branches: [verify/portal-chat-lambda]
permissions:
  contents: read
jobs:
  lock-lambda:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: 3.14 と 3.15 の Lambda 向け uv.lock を生成
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [Path("pyproject.toml"), *Path("packages").glob("*/pyproject.toml"), Path("tests/e2e/pyproject.toml"), Path("tools/pyproject.toml")]
          for path in paths:
              value = path.read_text().replace('requires-python = ">=3.14,<3.15"', 'requires-python = ">=3.14,<3.16"')
              if path == paths[0]:
                  value = value.replace("[dependency-groups]\n", "[dependency-groups]\n" + "model-sdk = [\"boto3\"]\ndecision-model = [\n    { include-group = \"model-sdk\" },\n    \"onnxruntime==1.32.0; python_version == '3.14'\",\n    \"numpy==2.4.0; python_version == '3.14'\",\n    \"tokenizers==0.22.2; python_version == '3.14'\",\n]\n")
              path.write_text(value)
          PY
          uv lock --python 3.14
          sha256sum uv.lock
          python - <<'PY'
          import base64, pathlib, textwrap, zlib
          data = pathlib.Path("uv.lock").read_bytes()
          for line in textwrap.wrap(base64.b64encode(zlib.compress(data, 9)).decode(), 240):
              print("UVLOCK " + line)
          PY
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [api, browser, cdk, synth]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-packages --python 3.14
      - if: matrix.suite == 'browser'
        run: |
          uv run --locked playwright install --with-deps chromium --only-shell
          uv run --locked python tools/build_frontend.py
      - if: matrix.suite == 'api'
        run: |
          uv run --locked python tools/manage.py contracts
          uv run --locked python -m tools.design.generate
          uv run --locked pytest -q packages/backend/tests packages/database/tests tools/tests --junitxml=artifacts/api.xml
      - if: matrix.suite == 'browser'
        run: uv run --locked pytest -q tests/e2e/browser --junitxml=artifacts/browser.xml
      - if: matrix.suite == 'cdk'
        run: uv run --locked pytest -q packages/infra/tests --junitxml=artifacts/cdk.xml
      - if: matrix.suite == 'synth'
        run: uv run --locked python tools/manage.py synth --help && uv run --locked python tools/manage.py synth
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-chat-${{ matrix.suite }}
          path: |
            artifacts/
            packages/infra/cdk.out/*.template.json
          if-no-files-found: ignore
