name: CloudFront portal E2E
description: Verify the deployed portal and the dedicated consumer's MFA login
inputs:
  portal_url:
    description: CloudFront portal origin
    required: true
  gateway_endpoint:
    description: Same-stack API Gateway endpoint for the authenticated boundary check
    required: false
  subject:
    description: Expected consumer subject
    required: true
  username:
    description: Dedicated consumer username
    required: true
  password:
    description: Dedicated consumer password
    required: true
  totp_seed:
    description: Dedicated consumer TOTP seed
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        enable-cache: false
    - name: Install locked test dependencies
      shell: bash
      run: uv sync --locked --package tsugite-e2e
    - name: Check CloudFront health, configuration and anonymous access
      env:
        E2E_PORTAL_URL: ${{ inputs.portal_url }}
      shell: bash
      run: |
        : "${E2E_PORTAL_URL:?Set E2E_PORTAL_URL in the cloudfront-e2e environment}"
        .venv/bin/python -m pytest -q tests/e2e/deployed/test_portal.py::test_public_cloudfront_api
    - name: Install Chromium
      shell: bash
      run: .venv/bin/playwright install --with-deps chromium --only-shell
    - name: Verify the authenticated portal and origin boundary
      env:
        E2E_PORTAL_URL: ${{ inputs.portal_url }}
        E2E_GATEWAY_ENDPOINT: ${{ inputs.gateway_endpoint }}
        E2E_SUBJECT: ${{ inputs.subject }}
        E2E_USERNAME: ${{ inputs.username }}
        E2E_PASSWORD: ${{ inputs.password }}
        E2E_TOTP_SEED: ${{ inputs.totp_seed }}
      shell: bash
      run: |
        : "${E2E_SUBJECT:?Set E2E_SUBJECT in the cloudfront-e2e environment}"
        : "${E2E_USERNAME:?Set E2E_USERNAME in the cloudfront-e2e environment}"
        : "${E2E_PASSWORD:?Set E2E_PASSWORD in the cloudfront-e2e environment}"
        : "${E2E_TOTP_SEED:?Set E2E_TOTP_SEED in the cloudfront-e2e environment}"
        suite=tests/e2e/deployed/test_portal.py
        cases=("$suite::test_consumer_login_and_catalog")
        if [[ -n "$E2E_GATEWAY_ENDPOINT" ]]; then
          cases+=("$suite::test_authenticated_origin_boundary")
        else
          echo "手動実行の E2E_GATEWAY_ENDPOINT が未設定のため、認証済みの直アクセス検証は対象外です。"
        fi
        .venv/bin/python -m pytest -q -rN --tb=no --show-capture=no "${cases[@]}"
