[project]
name = "tsugite-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi","uvicorn","pydantic>=2","sqlalchemy>=2,<3","alembic","aurora-dsql-sqlalchemy","psycopg[binary]","PyJWT[crypto]","httpx","mangum","boto3","pyyaml","openapi-spec-validator"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/app"]
