[project]
name = "tsugite-agent"
version = "0.1.0"
requires-python = ">=3.14,<3.16"
dependencies = ["boto3", "sqlalchemy>=2,<3", "tsugite-backend", "tsugite-database"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.tsugite.verify]
label = "エージェント"
