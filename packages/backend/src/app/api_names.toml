# OpenAPIの物理名をキーにした、設計書とAPI仕様で共用する和名。
[operations]
"GET /api/access-logs" = "API呼び出し履歴を検索する"
"GET /api/access-logs/download" = "API呼び出し履歴をファイルに出力する"
"GET /api/alerts" = "呼び出し件数の監視ルールを一覧する"
"PUT /api/alerts" = "呼び出し件数の通知・停止条件を設定する"
"GET /api/apis" = "カタログのAPIを検索する"
"POST /api/apis" = "APIをカタログに登録する"
"DELETE /api/apis/{key}" = "APIをカタログから削除する（論理削除）"
"GET /api/apis/{key}" = "APIの詳細と公開仕様を取得する"
"PUT /api/apis/{key}" = "APIの登録内容を更新する"
"GET /api/apis/{key}/operation-policy" = "APIの利用者別操作権限を確認する"
"PUT /api/apis/{key}/operation-policy" = "APIの利用者別操作権限を設定する"
"GET /api/apis/{key}/policy" = "APIの公開範囲と申請の承認条件を確認する"
"PUT /api/apis/{key}/policy" = "APIの公開範囲と申請の承認条件を設定する"
"PUT /api/apis/{key}/publication" = "APIの公開・掲載取り下げを切り替える"
"POST /api/apis/{key}/requests" = "特定の環境でのAPI利用を申請する"
"GET /api/audit" = "監査履歴を検索する"
"POST /api/auth/token" = "クライアント認証情報をアクセストークンに交換する"
"GET /api/catalog-page" = "カタログのAPIをページ単位で取得する"
"GET /api/config" = "ポータルのログイン設定を取得する"
"GET /api/credential-limits/{kind}/{key}" = "API・組織単位のトークン有効期間上限を確認する"
"PUT /api/credential-limits/{kind}/{key}" = "API・組織単位のトークン有効期間上限を設定する"
"POST /api/credentials" = "利用条件を指定して認証情報を発行する"
"GET /api/credentials/options" = "認証情報の発行時に選べる対象と上限を取得する"
"POST /api/credentials/{key_id}/rotate" = "クライアントシークレットを再発行する"
"POST /api/credentials/{key_id}/token" = "ポータルから短期アクセストークンを取得する"
"GET /api/dashboard" = "ダッシュボードの件数を集計する"
"POST /api/demo/{persona}" = "デモ利用者としてログインする"
"GET /api/health" = "サービスの稼働状態を確認する"
"GET /api/invoke/{key}/{environment}/{project}/{tail}" = "接続先APIにGETリクエストを転送する"
"POST /api/invoke/{key}/{environment}/{project}/{tail}" = "接続先APIにPOSTリクエストを転送する"
"PUT /api/invoke/{key}/{environment}/{project}/{tail}" = "接続先APIにPUTリクエストを転送する"
"PATCH /api/invoke/{key}/{environment}/{project}/{tail}" = "接続先APIにPATCHリクエストを転送する"
"DELETE /api/invoke/{key}/{environment}/{project}/{tail}" = "接続先APIにDELETEリクエストを転送する"
"GET /api/key-assets" = "認証情報の対象に選べるAPIを一覧する"
"GET /api/keys" = "発行済みの認証情報を一覧する"
"POST /api/keys" = "従来方式のAPIキーを発行する"
"DELETE /api/keys/{key}" = "認証情報を失効させる"
"GET /api/management-targets" = "監視対象に指定できるAPIの利用先を一覧する"
"GET /api/me" = "ログイン中の利用者の所属と権限を確認する"
"GET /api/members" = "ポータルの利用者を一覧する"
"POST /api/members" = "ポータルに利用者を招待する"
"DELETE /api/members/{subject}" = "ポータルの利用者を削除する"
"GET /api/metric-dimensions" = "利用統計を絞り込めるAPIとプロジェクトを一覧する"
"GET /api/metrics" = "時間帯別の呼び出し件数と応答時間を集計する"
"GET /api/notifications" = "受信した通知を一覧する"
"POST /api/notifications" = "利用者に通知を送る"
"GET /api/notifications/count" = "未読の通知件数を取得する"
"PUT /api/notifications/{key}/read" = "通知を既読にする"
"GET /api/requests" = "APIの利用申請を一覧する"
"POST /api/requests/{key}/{project}/{environment}" = "プロジェクトの利用申請を承認・却下・取り下げ・取消する"
"POST /api/requests/{key}/{project}/{environment}/{principal}" = "個人の利用申請を承認・却下・取り下げ・取消する"
"GET /api/workspace" = "組織の構成と利用者の所属を確認する"
"DELETE /api/workspace/memberships" = "利用者の所属を解除する"
"PUT /api/workspace/memberships" = "利用者の所属・役職・管理権限を設定する"
"PUT /api/workspace/units/{key}" = "部署・プロジェクトを登録または更新する"
"PUT /api/workspace/units/{key}/state" = "部署・プロジェクトの利用を停止または再開する"
"GET /api/workspace/units/{key}/usage" = "部署・プロジェクトの所属者とAPI利用実績を取得する"

