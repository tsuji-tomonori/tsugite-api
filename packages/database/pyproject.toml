[project]
name = "tsugite-database"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic",
    "sqlalchemy",
    "aurora-dsql-sqlalchemy",
    "aurora-dsql-python-connector[psycopg]>=0.2.7",
    "certifi",
    "psycopg[binary]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsugite_db"]
