[project]
name = "tsugite-database"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["alembic", "sqlalchemy", "aurora-dsql-sqlalchemy", "psycopg[binary]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsugite_db"]
