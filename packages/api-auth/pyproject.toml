[project]
name = "tsugite-api-auth"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = ["fastapi", "sqlalchemy>=2,<3", "tsugite-backend", "tsugite-database"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_auth"]

[tool.tsugite.verify]
label = "API呼び出し認証"
