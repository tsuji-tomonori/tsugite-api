AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC role for tsuji-tomonori/tsugite-api main deployments.

Parameters:
  BootstrapAdminUserPoolId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[\w-]+_[0-9a-zA-Z]+$'
    Description: Set to the UserPoolId output of TsugiteApi to enable the initial administrator workflow.
  CreateGitHubOidcProvider:
    Type: String
    Description: Set to false if this account already has the GitHub Actions OIDC provider.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  EnableBootstrapAdmin: !Not [!Equals [!Ref BootstrapAdminUserPoolId, '']]
  CreateProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows the tsugite-api main branch and GitHub environment to assume CDK deployment roles.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:tsuji-tomonori@39981658/tsugite-api@1466432528:environment:main
                token.actions.githubusercontent.com:ref: refs/heads/main
      Policies:
        - PolicyName: AssumeCdkBootstrapRoles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-deploy-role-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-file-publishing-role-${AWS::AccountId}-${AWS::Region}
      Tags:
        - Key: Application
          Value: TsugiteAPI
        - Key: ManagedBy
          Value: CloudFormation

  BootstrapAdminPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableBootstrapAdmin
    Properties:
      PolicyName: BootstrapPortalAdmin
      Roles: [!Ref GitHubDeployRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/TsugiteApi/*
          - Effect: Allow
            Action:
              - cognito-idp:ListUsersInGroup
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminAddUserToGroup
            Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${BootstrapAdminUserPoolId}

Outputs:
  GitHubDeployRoleArn:
    Description: Set this ARN as AWS_DEPLOY_ROLE_ARN in the GitHub Actions main environment.
    Value: !GetAtt GitHubDeployRole.Arn
